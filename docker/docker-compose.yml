# VolatileDNS lab: CoreDNS (DNS server), nginx back ends (ground truth), netem (network failure), the proxy.
# Subnet 172.28.0.0/24:  .2 CoreDNS  .3 VolatileDNS  .10 portal  .30-.35 session-a..f  .41-.44 cdn-1..4  .100 probe
name: volatiledns
x-web: &web
  image: nginx:1.27-alpine
  volumes: ["./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
  restart: "no"
services:
  coredns:
    image: coredns/coredns:1.11.3
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes: ["./coredns:/etc/coredns"]
    networks: {lab: {ipv4_address: 172.28.0.2}}
  netem:                      # shares CoreDNS's network namespace: tc netem there cuts the DNS server's network
    build: ./tools
    image: volatiledns-tools
    network_mode: "service:coredns"
    cap_add: [NET_ADMIN]
    depends_on: [coredns]
  proxy:
    build: {context: .., dockerfile: docker/proxy/Dockerfile}
    image: volatiledns-proxy
    command: ["--policy", "${POLICY:-volatile}", "--listen", "0.0.0.0:53", "--upstream", "172.28.0.2:53",
              "--db", "/data/vdns.sqlite", "--s-cap", "${S_CAP:-60}", "--s-fix", "${S_FIX:-60}", "--ttl-mult", "${TTL_MULT:-10}",
              "--epsilon", "${EPS:-0.05}", "--prior-seconds", "${PRIOR:-3600}", "--estimator", "${ESTIMATOR:-counted}",
              "--failure-recheck", "${RECHECK:-10}", "--no-restore"]
    volumes: ["./data:/data"]
    ports: ["127.0.0.1:5380:53/udp", "127.0.0.1:5380:53/tcp"]
    networks: {lab: {ipv4_address: 172.28.0.3}}
    depends_on: [coredns]
  capture:                    # tcpdump in the proxy's network namespace
    image: volatiledns-tools
    network_mode: "service:proxy"
    cap_add: [NET_ADMIN, NET_RAW]
    volumes: ["./captures:/captures"]
    depends_on: [proxy]
  probe:                      # opens real HTTP connections to the addresses the proxy hands out
    image: volatiledns-tools
    networks: {lab: {ipv4_address: 172.28.0.100}}
  portal:
    <<: *web
    hostname: portal
    networks: {lab: {ipv4_address: 172.28.0.10}}
  session-a:
    <<: *web
    hostname: session-a
    networks: {lab: {ipv4_address: 172.28.0.30}}
  session-b:
    <<: *web
    hostname: session-b
    networks: {lab: {ipv4_address: 172.28.0.31}}
  session-c:
    <<: *web
    hostname: session-c
    networks: {lab: {ipv4_address: 172.28.0.32}}
  session-d:
    <<: *web
    hostname: session-d
    networks: {lab: {ipv4_address: 172.28.0.33}}
  session-e:
    <<: *web
    hostname: session-e
    networks: {lab: {ipv4_address: 172.28.0.34}}
  session-f:
    <<: *web
    hostname: session-f
    networks: {lab: {ipv4_address: 172.28.0.35}}
  cdn-1:
    <<: *web
    hostname: cdn-1
    networks: {lab: {ipv4_address: 172.28.0.41}}
  cdn-2:
    <<: *web
    hostname: cdn-2
    networks: {lab: {ipv4_address: 172.28.0.42}}
  cdn-3:
    <<: *web
    hostname: cdn-3
    networks: {lab: {ipv4_address: 172.28.0.43}}
  cdn-4:
    <<: *web
    hostname: cdn-4
    networks: {lab: {ipv4_address: 172.28.0.44}}
networks:
  lab:
    ipam: {config: [{subnet: 172.28.0.0/24}]}
